<html lang="en">

    <title>Quote.Web — Daily Inspiration</title>

    <script>
      (function normalizeProjectRootUrl() {
        var path = window.location.pathname;
        var lastSegment = path.split('/').pop();
        var hasExtension = lastSegment.indexOf('.') !== -1;

        if (!path.endsWith('/') && !hasExtension) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- PWA Manifest & Favicon -->
    <link rel="icon" href="data:," />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#050505" />

    <!-- Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quote.Web" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

    <!-- Fonts -->
    <link rel="preload" href="./assets/fraunces-v38-latin-500-DnGCNyPD.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/manrope-v20-latin-500-BYYD-dBL.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Locally hosted in styles.css -->

    <!-- Icons -->
    <script src="./lucide.min.js" defer></script>

    <!-- Styles -->

    <!-- Runtime config -->
    <script src="./config.js" defer></script>

    <script type="module" crossorigin src="./assets/index-5Dv-V8kn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CixHAGrn.css">
  </head>

  <body>
    <div id="offline-banner" class="offline-banner">You are offline. Showing cached quotes.</div>
    <a href="#quote-text" class="skip-link">Skip to content</a>
    <div aria-live="polite" aria-atomic="true" id="quote-announcer" class="sr-only"></div>
    <div class="bg-canvas">
      <canvas id="starfield"></canvas>
    </div>
    <div class="grain"></div>

    <!-- Mobile Top Bar -->
    <header class="mobile-top-bar">
      <div class="brand-logo"></div>
      <span class="brand-name">Quote.Web</span>
    </header>

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="brand">
        <div class="brand-logo"></div>
        <span class="brand-name">Quote.Web</span>
      </div>
      <div class="nav-menu" role="navigation" aria-label="Primary navigation">
        <button
          type="button"
          class="nav-item active"
          data-nav="discover"
          data-action="nav-discover"
          aria-label="Discover"
          aria-current="page"
        >
          <i data-lucide="layout-grid" class="nav-icon"></i>
          <span class="nav-label">Discover</span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-nav="search"
          data-action="toggle-search"
          aria-label="Search"
          aria-expanded="false"
          aria-controls="cmd-palette"
        >
          <i data-lucide="search" class="nav-icon"></i>
          <span class="nav-label">Search</span>
          <span class="shortcut-hint">Ctrl K</span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-nav="favorites"
          data-action="open-drawer"
          data-drawer="favorites"
          aria-label="Favorites"
        >
          <i data-lucide="heart" class="nav-icon"></i>
          <span class="nav-label">Favorites</span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-nav="about"
          data-action="open-drawer"
          data-drawer="about"
          aria-label="About"
        >
          <i data-lucide="info" class="nav-icon"></i>
          <span class="nav-label">About</span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-nav="contact"
          data-action="open-drawer"
          data-drawer="contact"
          aria-label="Contact"
        >
          <i data-lucide="mail" class="nav-icon"></i>
          <span class="nav-label">Contact</span>
        </button>
        <button
          type="button"
          class="nav-item"
          data-nav="notifications"
          data-action="toggle-notifications"
          aria-label="Notifications"
        >
          <i data-lucide="bell" class="nav-icon" id="bell-icon"></i>
          <span class="nav-label" id="bell-label">Daily Quote</span>
        </button>
      </div>
    </nav>

    <!-- Main Workspace -->
    <main class="workspace">
      <div class="toolbar">
        <button
          type="button"
          class="toolbar-btn"
          data-action="toggle-theme"
          aria-label="Toggle Theme"
        >
          <i data-lucide="sun" class="icon-sun"></i>
          <i data-lucide="moon" class="icon-moon hidden"></i>
        </button>
      </div>

      <!-- Reader View -->
      <article class="reader-container">
        <div class="quote-badge">Loading...</div>
        <h1 class="quote-display loading" id="quote-text">...</h1>
        <div class="author-block">
          <div class="author-line"></div>
          <span id="quote-author">...</span>
        </div>
      </article>

      <!-- Floating Dock -->
      <div class="dock-trigger">
        <i data-lucide="chevron-up" class="dock-hint-arrow"></i>
      </div>
      <div class="dock">
        <button type="button" class="dock-btn" data-action="toggle-favorite" aria-label="Toggle Favorite" id="btn-favorite">
          <i data-lucide="heart" size="16" id="icon-favorite"></i>
        </button>
        <button type="button" class="dock-btn" data-action="copy-quote" aria-label="Copy Quote">
          <i data-lucide="copy" size="16"></i>
        </button>
        <button type="button" class="dock-btn" data-action="speak-quote" aria-label="Listen to Quote">
          <i data-lucide="volume-2" size="16"></i>
        </button>
        <button type="button" class="dock-btn" data-action="share-quote" aria-label="Share Quote">
          <i data-lucide="share-2" size="16"></i>
        </button>
        <button
          type="button"
          class="dock-btn"
          data-action="generate-image"
          aria-label="Generate Image"
        >
          <i data-lucide="image-down" size="16"></i>
        </button>
        <div class="dock-divider"></div>
        <button type="button" class="dock-btn" data-action="history-back" aria-label="Previous Quote" id="btn-back" disabled style="opacity: 0.5; pointer-events: none;">
          <i data-lucide="arrow-left" size="16"></i>
        </button>
        <button
          type="button"
          class="dock-btn primary"
          data-action="fresh-quote"
          aria-label="Get Fresh Quote"
        >
          <span>Fresh Quote</span>
          <i data-lucide="arrow-right" size="16"></i>
        </button>
      </div>
    </main>

    <!-- Overlays -->
    <div class="overlay-backdrop" id="backdrop" data-action="close-overlays"></div>

    <!-- Image Generator Modal -->
    <div
      class="image-gen-modal"
      id="image-gen-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Generate Shareable Image"
    >
      <div class="image-gen-header">
        <h2 class="image-gen-title">Share Image</h2>
        <button
          type="button"
          class="image-gen-close"
          data-action="close-image-gen"
          aria-label="Close"
        >
          <i data-lucide="x" size="20"></i>
        </button>
      </div>
      <div class="image-gen-preview-container">
        <img id="image-gen-preview" alt="Preview of generated quote image" />
      </div>
      <div class="image-gen-templates">
        <button
          type="button"
          class="template-btn active"
          data-action="select-template"
          data-template="deep-void"
          aria-label="Deep Void template"
        >
          <div class="template-preview deep-void"></div>
        </button>
        <button
          type="button"
          class="template-btn"
          data-action="select-template"
          data-template="luminous"
          aria-label="Luminous template"
        >
          <div class="template-preview luminous"></div>
        </button>
        <button
          type="button"
          class="template-btn"
          data-action="select-template"
          data-template="gradient-bliss"
          aria-label="Gradient Bliss template"
        >
          <div class="template-preview gradient-bliss"></div>
        </button>
      </div>
      <div class="image-gen-actions">
        <button type="button" class="dock-btn" data-action="copy-image" aria-label="Copy Image">
          <i data-lucide="copy" size="16"></i>
          <span>Copy</span>
        </button>
        <button
          type="button"
          class="dock-btn"
          data-action="download-image"
          aria-label="Download Image"
        >
          <i data-lucide="download" size="16"></i>
          <span>Save</span>
        </button>
        <button
          type="button"
          class="dock-btn primary"
          data-action="share-image-file"
          aria-label="Share Image"
        >
          <i data-lucide="share" size="16"></i>
          <span>Share</span>
        </button>
      </div>
    </div>

    <!-- Command Palette -->
    <div
      class="cmd-palette"
      id="cmd-palette"
      role="dialog"
      aria-modal="true"
      aria-label="Quote search command palette"
    >
      <div class="cmd-input-wrapper">
        <i data-lucide="search" size="18" class="cmd-search-icon"></i>
        <input
          type="text"
          class="cmd-input"
          placeholder="Search quotes..."
          disabled
          aria-controls="cmd-results"
          aria-activedescendant=""
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
        />
        <span class="cmd-kbd">ESC</span>
      </div>
      <div class="cmd-categories">
        <button type="button" class="cmd-chip" data-action="search-category" data-category="Inspiration">Inspiration</button>
        <button type="button" class="cmd-chip" data-action="search-category" data-category="Wisdom">Wisdom</button>
        <button type="button" class="cmd-chip" data-action="search-category" data-category="Success">Success</button>
        <button type="button" class="cmd-chip" data-action="search-category" data-category="Life">Life</button>
      </div>
      <div class="cmd-filters">
        <label for="cmd-author" class="sr-only">Filter by author</label>
        <input
          type="text"
          id="cmd-author"
          class="cmd-filter-input"
          placeholder="Filter by author"
        />
        <select id="cmd-sort" class="cmd-filter-select" aria-label="Sort field">
          <option value="">Relevance</option>
          <option value="author">Author</option>
          <option value="text">Quote Text</option>
        </select>
        <select id="cmd-order" class="cmd-filter-select" aria-label="Sort order">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
        <select id="cmd-limit" class="cmd-filter-select" aria-label="Results per page">
          <option value="20" selected>20</option>
          <option value="40">40</option>
          <option value="60">60</option>
        </select>
      </div>
      <div class="cmd-meta" id="cmd-meta"></div>
      <div class="cmd-results" id="cmd-results" role="listbox" aria-label="Search results"></div>
    </div>

    <!-- Side Drawer -->
    <aside class="drawer" id="side-drawer">
      <button
        type="button"
        class="drawer-close"
        data-action="close-drawer"
        aria-label="Close Drawer"
      >
        <i data-lucide="x" size="24"></i>
      </button>
      <div class="drawer-content" id="drawer-body">
        <!-- Content Injected via JS -->
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite">Copied to clipboard</div>
  </body>
</html>
